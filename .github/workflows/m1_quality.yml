name: M1 dataset quality
on:
  push:
    paths: ['sft/m1/**', 'src/m1_validate.py', 'tests/test_m1.py']
  pull_request:
    paths: ['sft/m1/**', 'src/m1_validate.py', 'tests/test_m1.py']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.m1_validate
