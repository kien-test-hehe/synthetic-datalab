name: M4 authored cases and experiment validation
on:
  push:
    branches: [feature/m4-authored-and-model-eval]
    paths: ['sft/m4/**', 'src/m4/**', 'src/eval/**', 'src/authored_export.py', 'src/authored_language.py', 'src/m1_oracles.py', 'sft/authored/**', 'tests/**', 'tests/test_m4.py', '.github/workflows/m4_quality.yml']
  pull_request:
    paths: ['sft/m4/**', 'src/m4/**', 'src/eval/**', 'src/authored_export.py', 'src/authored_language.py', 'src/m1_oracles.py', 'sft/authored/**', 'tests/**', 'tests/test_m4.py', '.github/workflows/m4_quality.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test all milestones and evaluation with mocked local inference
        run: python -m unittest discover -s tests -v
      - name: Build 40 original M4 QA
        run: python -m src.m4.authored
      - name: Build frozen 800-world M3 corpus
        run: python -m src.m3.augment --worlds 800 --seed 42 --out sft/m3/outputs
      - name: Validate original corpus
        run: python -m src.m3.validate --worlds 800 --root sft/m3/outputs
      - name: Build full authored 10K export
        run: python -m src.authored_export
      - name: Prepare matched world-disjoint experiments
        run: python -m src.m4.experiments
      - name: Prepare program-disjoint experiments
        run: python -m src.m4.experiments --ood --out sft/m4/experiments_ood
      - uses: actions/upload-artifact@v4
        with:
          name: financialdoclab-m4-experiments
          path: |
            sft/m4/exports/
            sft/m4/experiments/
            sft/m4/experiments_ood/
          retention-days: 30
